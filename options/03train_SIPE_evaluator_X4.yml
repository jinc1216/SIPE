# Stage 3: train SIPE-SR Evaluator for x4 SR
name: 03_SIPE_evaluator_X4
model_type: SIPEEvaluatorModel
scale: 4
num_gpu: 4
manual_seed: 0
bsz: 4
datasets:
  train:
    name: SR_Image_Train_X4
    type: PairedImageDataset
    dataroot_gt: /gemini/data-2/HQ_subimages
    dataroot_lq: /gemini/data-2/LQ_subimages_x4
    io_backend:
      type: disk
    gt_size: 256
    scale: 4
    use_resize_crop: false
    use_flip: true
    use_rot: true
    use_shuffle: true
    batch_size_per_gpu: 4
    num_worker_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: cpu
    num_prefetch_queue: 128
  val:
    name: SR_Image_Valid_X4
    type: PairedImageDataset
    dataroot_gt: /gemini/data-2/div2k_valid/gt_mod16
    dataroot_lq: /gemini/data-2/div2k_valid/lrx4
    io_backend:
      type: disk
    scale: 4
network_g:
  type: SIPETokenNet
  gt_resolution: 256
  scale_factor: 4
  LQ_stage: true
  code_only: true
  predictor_blk_depth: 6
  predictor_blk_num: 4
  predictor_num_heads: 8
  predictor_window_size: 8
  lq_base_ch: 64
  lq_swin_blk_depth: 6
  lq_swin_blk_num: 2
  use_guided_refine: true
  use_sft_fusion: true
  sft_cond_source: shared_lq
  sft_levels: [8, 4]
  sft_zero_init: true
  refine_blocks: 4
  refine_channels: 64
  vqgan_opt:
    ckpt_path: null
    n_embed: 1024
    embed_dim: 256
    use_quant_conv: true
    quant_conv_init: identity
    ddconfig:
      in_channels: 3
      emb_dim: 256
      resolution: [256, 256]
      nf: 128
      global_blks: swin
      swin_dim: 256
      swin_window: 8
      swin_blk_depth: 6
      swin_blk_num: 1
      ch_mult: [1, 2, 2, 4]
network_hq:
  type: VQModel
  ckpt_path: null
  n_embed: 1024
  embed_dim: 256
  use_quant_conv: true
  quant_conv_init: identity
  ddconfig:
    in_channels: 3
    emb_dim: 256
    resolution: [256, 256]
    nf: 128
    global_blks: swin
    swin_dim: 256
    swin_window: 8
    swin_blk_depth: 6
    swin_blk_num: 1
    ch_mult: [1, 2, 2, 4]
network_evaluator:
  type: SIPEEvaluator
  token_embedding_mode: frozen_vq
  input_resolution: [32, 32]
  embed_dim: 256
  blk_depth: 6
  blk_num: 2
  num_heads: 8
  window_size: 8
  codebook_size: 1024
  use_cond_feats: true
path:
  pretrain_network_hq: null
  pretrain_network_g: experiments/02_SIPE_predictor_X4/models/net_g_latest.pth
  pretrain_network_evaluator: experiments/03_SIPE_evaluator_X2/models/net_evaluator_latest.pth
  strict_load: true
  strict_load_hq: false
  strict_load_evaluator: true
  resume_state: null
  ignore_resume_networks: [network_g, network_hq]
train:
  gradient_accumulation_steps: 1
  use_amp: true
  amp_dtype: bfloat16
  optim_evaluator:
    type: Adam
    lr: 0.0001
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: CosineAnnealingRestartLR
    periods: [200000]
    restart_weights: [1]
    eta_min: 1.0e-05
  total_iter: 200000
  warmup_iter: -1
  sample_temperature: 1.0
  token_schedule: cosine
  evaluator_input_opt:
    mode: rollout
  evaluator_condition_opt:
    use_lq_feats: true
  evaluator_sampling_opt:
    mode: multinomial
  evaluator_refinement_opt:
    token_update_mode: full
  evaluator_supervision_opt:
    target_mode: correctness_transition
val:
  val_freq: !!float 1e4
  save_img: true
  num_refine_steps: 6
  token_update_mode: full
  decode_sampling: multinomial
  sample_temperature: 1.0
  remask_budget_schedule: full_cosine
  key_metric: lpips
  metrics:
    psnr:
      type: psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: ssim
      crop_border: 4
      test_y_channel: true
    lpips:
      type: lpips
      better: lower
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1e4
  save_latest_freq: !!float 1e4
  show_tf_imgs_freq: !!float 1e4
  use_tb_logger: true
dist_params:
  backend: nccl
  port: 16604
find_unused_parameters: false
